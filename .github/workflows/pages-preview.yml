name: Publish Kiddy Clash Development Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kiddy-clash-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Development Preview
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Validate level
        run: npm run validate:level

      - name: Validate PWA
        run: npm run validate:pwa

      - name: Validate premium art contract
        run: npm run validate:art

      - name: Typecheck
        run: npm run typecheck

      - name: Build preview
        env:
          VITE_BUILD_CHANNEL: development-preview
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy Development Preview
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
