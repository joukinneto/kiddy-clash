name: Kiddy Clash CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Validate level configuration
        run: npm run validate:level

      - name: Validate PWA contract
        run: npm run validate:pwa

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
